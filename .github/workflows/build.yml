name: Build MT7601U AP Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-23.2
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget xz-utils

      - name: Download clang-r416183b
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Diagnóstico previo
        run: |
          cd kernel
          echo "===== init.c: línea de interface_modes ====="
          grep -n "interface_modes" drivers/net/wireless/mediatek/mt7601u/init.c
          echo ""
          echo "===== Versión del kernel ====="
          head -5 Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL"
          echo ""
          echo "===== Defconfigs disponibles para holi ====="
          find arch/arm64/configs -iname "*holi*" 2>/dev/null

      - name: Patch Kernel Source (AP Mode)
        run: |
          cd kernel

          F=drivers/net/wireless/mediatek/mt7601u/init.c
          
          if grep -q "wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION);" "$F"; then
            sed -i 's/wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION);/wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION) | BIT(NL80211_IFTYPE_AP);/' "$F"
            echo "=== Parche AP aplicado (STATION -> STATION | AP) ==="
          elif grep -q "wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION) |" "$F"; then
            echo "=== Parche AP ya estaba aplicado ==="
          else
            echo "=== ADVERTENCIA: No se encontró la línea esperada. Aplicando fallback ==="
            grep -n "interface_modes" "$F"
            sed -i 's/BIT(NL80211_IFTYPE_STATION)/BIT(NL80211_IFTYPE_STATION) | BIT(NL80211_IFTYPE_AP)/' "$F"
          fi
          
          echo ""
          echo "=== Verificación del parche ==="
          grep -n "interface_modes" "$F"

      - name: Prepare Kernel Config
        run: |
          cd kernel
          mkdir -p ../out
          
          echo "===== Generando .config desde defconfig oficial ====="
          
          if [ -f "arch/arm64/configs/vendor/holi-qgki_defconfig" ]; then
            echo "=== Usando vendor/holi-qgki_defconfig ==="
            make ARCH=arm64 O=../out vendor/holi-qgki_defconfig
          else
            echo "=== ERROR: no se encontró holi-qgki_defconfig ==="
            ls arch/arm64/configs/vendor/ | grep -i holi
            exit 1
          fi
          
          for fragment in \
            arch/arm64/configs/vendor/holi_GKI.config \
            arch/arm64/configs/vendor/holi_consolidate.config \
            arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config; do
            if [ -f "$fragment" ]; then
              echo "=== Aplicando fragmento: $fragment ==="
              cat "$fragment" >> ../out/.config
            fi
          done
          
          echo ""
          echo "===== Verificando que el .config se creó ====="
          wc -l ../out/.config

      - name: Configure Kernel (forzar valores críticos)
        run: |
          cd kernel
          CONFIG=../out/.config
          
          echo "=== ANTES de los ajustes ==="
          grep -E "CONFIG_(LOCALVERSION|MODVERSIONS|MODULE_FORCE_LOAD|MT7601U|WLAN_VENDOR_MEDIATEK)" $CONFIG || echo "(ninguno seteado)"
          
          # === FORZAR valores críticos ===
          ./scripts/config --file $CONFIG --set-str CONFIG_LOCALVERSION "-moto-gc8bc4b74db62"
          ./scripts/config --file $CONFIG --disable CONFIG_LOCALVERSION_AUTO
          ./scripts/config --file $CONFIG --enable CONFIG_MODVERSIONS
          ./scripts/config --file $CONFIG --enable CONFIG_MODULE_FORCE_LOAD
          
          # === Añadir el driver MT7601U ===
          ./scripts/config --file $CONFIG --module CONFIG_MT7601U
          ./scripts/config --file $CONFIG --enable CONFIG_WLAN_VENDOR_MEDIATEK
          
          # === Asegurar dependencias WiFi ===
          ./scripts/config --file $CONFIG --enable CONFIG_CFG80211
          ./scripts/config --file $CONFIG --enable CONFIG_MAC80211
          ./scripts/config --file $CONFIG --enable CONFIG_MAC80211_RC_MINSTREL
          ./scripts/config --file $CONFIG --enable CONFIG_MAC80211_RC_MINSTREL_HT
          
          # === Resolver dependencias ===
          yes "" | make ARCH=arm64 O=../out olddefconfig
          
          echo ""
          echo "=== DESPUÉS de los ajustes ==="
          grep -E "CONFIG_(MT7601U|WLAN_VENDOR_MEDIATEK|LOCALVERSION|MODVERSIONS|MODULE_FORCE_LOAD|CFG80211|MAC80211)" $CONFIG

      - name: Build MT7601U module (Opción C - rápido)
        run: |
          cd kernel
          
          echo "=== Paso 1: modules_prepare (genera herramientas de build) ==="
          make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            modules_prepare
          
          echo ""
          echo "=== Paso 2: Verificar que modpost se generó ==="
          ls -lh ../out/scripts/mod/modpost || echo "=== modpost NO generado ==="
          
          echo ""
          echo "=== Paso 3: Compilar mt7601u.ko ==="
          KBUILD_MODPOST_WARN=1 make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            M=drivers/net/wireless/mediatek/mt7601u \
            modules

      - name: Verify module
        run: |
          cd kernel
          KO=../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
          
          if [ -f "$KO" ]; then
            echo "=== ¡MÓDULO COMPILADO! ==="
            ls -lh "$KO"
            echo ""
            echo "=== Vermagic del módulo ==="
            modinfo "$KO" | grep vermagic || true
            echo ""
            echo "=== Información del módulo ==="
            modinfo "$KO" | head -15 || true
            echo ""
            echo "=== Verificar modo AP en el .ko ==="
            if strings "$KO" | grep -q "NL80211_IFTYPE_AP"; then
              echo "=== MODO AP PRESENTE ==="
            else
              echo "=== ALERTA: Modo AP NO detectado en el binario ==="
            fi
          else
            echo "=== ERROR: mt7601u.ko NO se generó ==="
            find ../out -name "*.ko" 2>/dev/null | head -20
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-ap-module
          path: |
            out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
