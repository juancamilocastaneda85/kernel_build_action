name: Build MT7601U AP Driver (Full Kernel Build)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-23.2
          path: kernel

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget xz-utils

      - name: Download clang
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Patch for AP mode
        run: |
          cd kernel
          D=drivers/net/wireless/mediatek/mt7601u
          sed -i 's/wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION);/wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION) | BIT(NL80211_IFTYPE_AP);/' $D/init.c
          grep -n "interface_modes" $D/init.c

      - name: Patch qcom_scm
        run: |
          cd kernel
          F=drivers/firmware/qcom_scm.c
          echo "=== ANTES ==="
          grep -n "initcall\|scm_mem_protection_init" $F
          sed -i 's|^early_initcall(scm_mem_protection_init);|/* PATCH: disabled for module build */|' $F
          sed -i 's|^static int __init scm_mem_protection_init(void)|static int __init __maybe_unused scm_mem_protection_init(void)|' $F
          echo "=== DESPUÉS ==="
          grep -n "initcall\|scm_mem_protection_init" $F

      - name: Patch smb1398-charger
        run: |
          cd kernel
          F=drivers/power/supply/qcom/smb1398-charger.c
          echo "=== ANTES ==="
          grep -n "of_device_get_match_data" $F
          sed -i 's/(int)of_device_get_match_data(chip->dev)/(int)(intptr_t)of_device_get_match_data(chip->dev)/' $F
          echo "=== DESPUÉS ==="
          grep -n "of_device_get_match_data" $F

      - name: Configure kernel
        run: |
          cd kernel
          mkdir -p ../out
          make ARCH=arm64 O=../out vendor/holi-qgki_defconfig
          cat arch/arm64/configs/vendor/holi_GKI.config >> ../out/.config
          cat arch/arm64/configs/vendor/holi_consolidate.config >> ../out/.config
          cat arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config >> ../out/.config
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --enable CONFIG_CFG80211
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211_RC_MINSTREL
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211_RC_MINSTREL_HT
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto-gc8bc4b74db62"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO
          yes "" | make ARCH=arm64 O=../out olddefconfig
          grep -E "CONFIG_(MT7601U|WLAN_VENDOR_MEDIATEK)" ../out/.config

      - name: Build kernel modules (full)
        run: |
          cd kernel
          make ARCH=arm64 O=../out -j4 \
            KCFLAGS="-Wno-error -Wno-void-pointer-to-int-cast -Wno-int-to-void-pointer-cast -Wno-unused-function -Wno-implicit-function-declaration -Wno-unused-variable" \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            KBUILD_MODPOST_WARN=1 \
            modules

      - name: Verify module
        run: |
          cd kernel
          KO=../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
          if [ -f "$KO" ]; then
            echo "=== MODULO COMPILADO ==="
            ls -lh "$KO"
            modinfo "$KO" | grep vermagic
            strings "$KO" | grep -q "NL80211_IFTYPE_AP" && echo "=== MODO AP PRESENTE ==="
          else
            echo "=== mt7601u.ko NO generado ==="
            find ../out -name "mt7601u.ko" 2>/dev/null
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-module
          path: out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
