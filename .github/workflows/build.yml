name: Build MT7601U AP Driver
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-23.2
          path: kernel

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget xz-utils

      - name: Download clang
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Patch for AP mode
        run: |
          cd kernel
          D=drivers/net/wireless/mediatek/mt7601u
          sed -i 's/wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION);/wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION) | BIT(NL80211_IFTYPE_AP);/' $D/init.c
          grep -n "interface_modes" $D/init.c

      - name: Patch mt7601u traces
        run: |
          cd kernel
          D=drivers/net/wireless/mediatek/mt7601u
          printf '/* PATCH: trace.h vacio */\n#ifndef __MT7601U_TRACE_H\n#define __MT7601U_TRACE_H\n#endif\n' > $D/trace.h
          echo '/* PATCH: trace.c vacio */' > $D/trace.c
          if ! grep -q "PATCH_PHY_TYPES" $D/init.c; then
            printf '/* PATCH_PHY_TYPES */\n#ifndef MT_PHY_TYPE_CCK\n#define MT_PHY_TYPE_CCK 0\n#endif\n#ifndef MT_PHY_TYPE_OFDM\n#define MT_PHY_TYPE_OFDM 1\n#endif\n#ifndef MT_PHY_TYPE_HT\n#define MT_PHY_TYPE_HT 2\n#endif\n#ifndef MT_PHY_TYPE_HT_GF\n#define MT_PHY_TYPE_HT_GF 3\n#endif\n' > /tmp/phy_types.h
            cat /tmp/phy_types.h $D/init.c > /tmp/init_new.c
            mv /tmp/init_new.c $D/init.c
          fi
          grep -ohE 'trace_[a-zA-Z0-9_]+\(' $D/*.c | sed 's/($//' | sort -u | \
            grep -v 'trace_mt_mcu_msg_send_cs' | \
            awk '{print "#define " $0 "(...) do {} while (0)"}' > /tmp/patch_header.txt
          echo "=== Stubs generados ==="
          cat /tmp/patch_header.txt
          for f in usb.c init.c main.c mcu.c dma.c core.c eeprom.c phy.c mac.c tx.c util.c; do
            FILE=$D/$f
            if [ -f "$FILE" ]; then
              LINE=$(grep -n "^#include" "$FILE" | tail -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                sed -i "${LINE}r /tmp/patch_header.txt" "$FILE"
              fi
            fi
          done
          if ! grep -q "PATCH_MAC_INCLUDES" $D/mac.h; then
            printf '/* PATCH_MAC_INCLUDES */\n#include <linux/types.h>\n#include <linux/skbuff.h>\n#include <linux/ieee80211.h>\n' > /tmp/mac_includes.h
            cat /tmp/mac_includes.h $D/mac.h > /tmp/mac_new.h
            mv /tmp/mac_new.h $D/mac.h
          fi
          for f in dma.c phy.c mac.c tx.c; do
            FILE=$D/$f
            if [ -f "$FILE" ] && ! grep -q '#include "mac.h"' "$FILE"; then
              LINE=$(grep -n "^#include" "$FILE" | tail -1 | cut -d: -f1)
              sed -i "${LINE}a #include \"mac.h\"" "$FILE"
            fi
          done
          for f in mac.c tx.c; do
            FILE=$D/$f
            if [ -f "$FILE" ] && ! grep -q '#include "regs.h"' "$FILE"; then
              LINE=$(grep -n "^#include" "$FILE" | tail -1 | cut -d: -f1)
              sed -i "${LINE}a #include \"regs.h\"" "$FILE"
            fi
          done

      - name: Configure kernel (minimal, sin MMI que no necesitamos)
        run: |
          cd kernel
          mkdir -p ../out
          make ARCH=arm64 O=../out vendor/holi-qgki_defconfig
          for opt in \
            MSM_PIL_SSR_GENERIC \
            MSM_PIL \
            MSM_SERVICE_LOCATOR \
            MSM_SERVICE_NOTIFIER \
            MSM_SUBSYSTEM_RESTART \
            QCOM_RPMH \
            QCOM_RPMHPD \
            QCOM_MEMORY_DUMP_V2 \
            QCOM_MINIDUMP \
            QCOM_MINIDUMP_FTRACE \
            QCOM_MINIDUMP_PANIC_DUMP \
            QCOM_MICRODUMP \
            QCOM_SECURE_BUFFER \
            MSM_GLINK_SSR \
            MSM_CDSP_LOADER \
            MSM_RPM_SMD \
            SCSI_UFS_QCOM \
            SCSI_UFSHCD \
            SCSI_UFSHCD_QTI \
            SCSI_UFSHCD_PLATFORM \
            SCSI_UFSHCD_PCI \
            SCSI_UFS_CRYPTO \
            SCSI_UFS_CRYPTO_QTI \
            SCSI_UFS_BSG \
            SCSI_UFS_HISI \
            SCSI_UFS_DWC_TC_PLATFORM \
            UFSFEATURE \
            UFSHPB \
            UFSTW \
            UFSHID \
            UFSHID_POC \
            SCSI_SKHPB \
            SCSI_SKHID \
            MICRON_HPB \
            MICRON_UFSHID \
            IPA3 \
            IPA_WDI_UNIFIED_API \
            USB_BAM \
            MSM_SPSS_UTILS \
            MSM_BOOT_STATS \
            QTI_HW_KEY_MANAGER \
            QTI_CRYPTO_COMMON \
            QTI_CRYPTO_TZ \
            QTI_CRYPTO_FDE ; do
            ./scripts/config --file ../out/.config --disable CONFIG_$opt
          done
          ./scripts/config --file ../out/.config --enable CONFIG_QCOM_SMEM
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --enable CONFIG_CFG80211
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211_RC_MINSTREL
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211_RC_MINSTREL_HT
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto-gc8bc4b74db62"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO
          yes "" | make ARCH=arm64 O=../out olddefconfig
          echo "=== Config final ==="
          grep -E "CONFIG_(MT7601U|WLAN_VENDOR_MEDIATEK|QCOM_SMEM|SCSI_UFS|IPA3|MSM_PIL)" ../out/.config

      - name: Build full kernel modules
        run: |
          cd kernel
          make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            modules
          echo ""
          echo "=== DEPENDS del mt7601u.ko ==="
          modinfo ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko | grep -i "depends"
          echo "=== VERMAGIC ==="
          modinfo ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko | grep -i vermagic
          echo "=== ALIASES ==="
          modinfo ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko | grep -i "alias=usb" | head -3
          echo "=== INITSIZE (debe ser > 0) ==="
          readelf -S ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko 2>/dev/null | grep -A 1 ".init.text"

      - name: Copy mt7601u.ko
        run: |
          cd kernel
          mkdir -p ../ko_output
          find ../out -name "mt7601u.ko" -exec cp {} ../ko_output/ \; || true
          ls -la ../ko_output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-module
          path: ko_output/mt7601u.ko
