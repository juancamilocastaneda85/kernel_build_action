name: Build Kernel with MT7601U

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: SushiKernel/android_kernel_motorola_fogos_nah
          ref: seventeen
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3

      - name: Download clang-r416183b
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=arm64 O=../out vendor/fogos_defconfig
          ./scripts/config --file ../out/.config --enable CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --disable CONFIG_LTO
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_REL_CRCS
          make ARCH=arm64 O=../out olddefconfig

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            Image

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm64/boot/Image
            out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
