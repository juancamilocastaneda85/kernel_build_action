name: Build Kernel with MT7601U

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: SushiKernel/android_kernel_motorola_fogos_nah
          ref: seventeen
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget xz-utils

      - name: Download clang-r416183b
        run: |
          mkdir -p clang
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b669748458572622ed716407611633c5415da25c/clang-r416183b.tar.gz" -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Fix pgtable.h include
        run: |
          cd kernel
          find drivers/staging/rksu -name "*.c" -o -name "*.h" | xargs grep -l "linux/pgtable.h" 2>/dev/null | while read f; do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
          done
          echo "Fixed pgtable.h includes"

      - name: Create fs1815 Makefile
        run: |
          cd kernel
          if [ ! -f techpack/audio/asoc/codecs/fs1815/Makefile ]; then
            cat > techpack/audio/asoc/codecs/fs1815/Makefile << 'EOF'
          # SPDX-License-Identifier: GPL-2.0-only
          snd-soc-fs1815-objs := fs1815.o fsm_core.o fsm_firmware.o fsm_i2c.o fsm_misc.o
          obj-$(CONFIG_SND_SOC_FS1815) += snd-soc-fs1815.o
          EOF
            echo "Created fs1815 Makefile"
          else
            echo "fs1815 Makefile already exists"
          fi

      - name: Configure kernel
        run: |
          cd kernel
          mkdir -p ../out
          cp ../fogos_real_config ../out/.config
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --disable CONFIG_LTO
          ./scripts/config --file ../out/.config --disable CONFIG_LTO_CLANG
          ./scripts/config --file ../out/.config --disable CONFIG_LTO_CLANG_THIN
          ./scripts/config --file ../out/.config --disable CONFIG_LTO_CLANG_FULL
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_REL_CRCS
          ./scripts/config --file ../out/.config --disable CONFIG_KSU
          ./scripts/config --file ../out/.config --set-val CONFIG_FRAME_WARN 0
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto-g26b07e8cb7f6"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO
          ./scripts/config --file ../out/.config --enable CONFIG_SCHED_WALT
          ./scripts/config --file ../out/.config --enable CONFIG_SCHED_CASS
          ./scripts/config --file ../out/.config --enable CONFIG_SND_SOC_FS1815
          ./scripts/config --file ../out/.config --enable CONFIG_SND_SOC_FS1815_DLKM
          ./scripts/config --file ../out/.config --enable CONFIG_CFI_CLANG
          ./scripts/config --file ../out/.config --enable CONFIG_CFI_CLANG_SHADOW
          yes "1" | make ARCH=arm64 O=../out olddefconfig

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            KCFLAGS="-fsanitize=cfi" \
            Image modules

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm64/boot/Image
            out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
