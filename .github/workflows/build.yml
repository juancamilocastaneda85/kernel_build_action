name: Build Kernel with MT7601U

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: SushiKernel/android_kernel_motorola_fogos_nah
          ref: seventeen
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget xz-utils

      - name: Download clang-r416183b
        run: |
          mkdir -p clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz -O clang.tar.xz
          tar -xf clang.tar.xz -C clang --strip-components=1
          rm clang.tar.xz

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=arm64 O=../out vendor/fogos_defconfig
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --disable CONFIG_LTO
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_REL_CRCS
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_SIG
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_SIG_ALL
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_SIG_FORCE
          ./scripts/config --file ../out/.config --disable CONFIG_STRICT_MODULE_RWX
          ./scripts/config --file ../out/.config --module CONFIG_MAC80211
          ./scripts/config --file ../out/.config --module CONFIG_CFG80211
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto-g26b07e8cb7f6"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO
          yes "" | make ARCH=arm64 O=../out olddefconfig

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            Image modules

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm64/boot/Image
            out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
