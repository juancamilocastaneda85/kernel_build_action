name: Build Kernel with MT7601U

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-23.2
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget xz-utils

      - name: Download clang-r416183b
        run: |
          mkdir -p clang
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/8fd13dca1a6dfbc43fc54b2408d49199981c387b/clang-r416183b.tar.gz" -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Fix trace.o include path
        run: |
          cd kernel
          D=drivers/net/wireless/mediatek/mt7601u
          sed -i 's|CFLAGS_trace.o := -I$(src)|CFLAGS_trace.o := -I$(srctree)/$(src)|' $D/Makefile
          grep CFLAGS_trace $D/Makefile

      - name: Configure kernel
        run: |
          cd kernel
          make ARCH=arm64 O=../out CC=../clang/bin/clang LD=../clang/bin/ld.lld vendor/holi-qgki_defconfig
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --disable CONFIG_LTO_CLANG
          ./scripts/config --file ../out/.config --enable CONFIG_LTO_NONE
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_REL_CRCS
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_SIG
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_SIG_ALL
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_SIG_FORCE
          ./scripts/config --file ../out/.config --disable CONFIG_STRICT_MODULE_RWX
          ./scripts/config --file ../out/.config --enable CONFIG_MODVERSIONS
          ./scripts/config --file ../out/.config --enable CONFIG_CFI_CLANG
          ./scripts/config --file ../out/.config --enable CONFIG_CFI_CLANG_SHADOW
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto-gc8bc4b74db62"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO
          make ARCH=arm64 O=../out CC=../clang/bin/clang LD=../clang/bin/ld.lld olddefconfig < /dev/null

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            Image modules < /dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm64/boot/Image
            out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
