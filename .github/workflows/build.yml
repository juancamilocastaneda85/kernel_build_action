name: Build Kernel with MT7601U

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-23.2
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget xz-utils

      - name: Download clang-r416183b
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Patch Kernel Source
        run: |
          cd kernel

          # 1. probe_user_write
          if ! grep -q "probe_user_write" include/linux/uaccess.h; then
            LINE=$(grep -n "^#endif" include/linux/uaccess.h | tail -1 | cut -d: -f1)
            sed -i "${LINE}i\\
          \\
          static inline bool probe_user_write(const void __user *dst, const void *src, size_t len)\\
          {\\
              if (!access_ok(dst, len))\\
                  return false;\\
              return !copy_to_user((void __user *)dst, src, len);\\
          }" include/linux/uaccess.h
          fi

          # 2. taskstats
          sed -i 's/^#elif$/#elif defined(CONFIG_SYSSTATS)/' kernel/taskstats.c
          sed -i 's/sysstats_fill_zoneinfo(stats);/\/\/ PATCH: ignore sysstats_fill_zoneinfo/' kernel/taskstats.c

          # 3. apcs-msm8916.c
          sed -i 's/static const u32 gpll0_a53cc_map\[\] = {/static const struct parent_map gpll0_a53cc_map[] = {/' drivers/clk/qcom/apcs-msm8916.c

          # 4. gcc-qcs404.c
          sed -i '/^enum {/a \	P_XO,\n\tP_GPLL0_OUT_AUX,' drivers/clk/qcom/gcc-qcs404.c

          # 5. qrtr/tun.c
          sed -i 's/qrtr_endpoint_register(&tun->ep, QRTR_EP_NET_ID_AUTO, 0)/qrtr_endpoint_register(\&tun->ep, QRTR_EP_NET_ID_AUTO, false, NULL)/' net/qrtr/tun.c

          # 6. cts_driver.c
          sed -i '1i #include <linux/fb.h>' drivers/input/touchscreen/chipone_tddi_v2_mmi/cts_driver.c
          sed -i '1i #ifndef FB_EARLY_EVENT_BLANK\n#define FB_EARLY_EVENT_BLANK 0x10\n#endif' drivers/input/touchscreen/chipone_tddi_v2_mmi/cts_driver.c

          # 7. i2c-qcom-geni.c (FIX COMPLETO)
          sed -i 's/gi2c->base/gi2c->se.base/g' drivers/i2c/busses/i2c-qcom-geni.c
          if ! grep -q "geni_write_reg" drivers/i2c/busses/i2c-qcom-geni.c; then
            sed -i '1i static inline void geni_write_reg(u32 val, void __iomem *base) { writel_relaxed(val, base); }' drivers/i2c/busses/i2c-qcom-geni.c
          fi

          # 8. fb.h global
          sed -i '/^#define FB_EVENT_BLANK/a #ifndef FB_EARLY_EVENT_BLANK\n#define FB_EARLY_EVENT_BLANK  0x10\n#endif' include/linux/fb.h

          echo "Kernel source patched."

      - name: Configure kernel
        run: |
          cd kernel
          mkdir -p ../out
          make ARCH=arm64 O=../out defconfig
          cat arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config >> ../out/.config || true

          # ---- WiFi / antena: NO TOCAR, DEBE SOBREVIVIR ----
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211_RC_MINSTREL
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211_RC_MINSTREL_HT
          ./scripts/config --file ../out/.config --enable CONFIG_CFG80211

          # ---- Quitar solo lo que molesta a la verificación ----
          ./scripts/config --file ../out/.config --disable CONFIG_LTO
          ./scripts/config --file ../out/.config --disable CONFIG_LTO_CLANG
          ./scripts/config --file ../out/.config --disable CONFIG_LTO_CLANG_THIN
          ./scripts/config --file ../out/.config --disable CONFIG_LTO_CLANG_FULL
          ./scripts/config --file ../out/.config --disable CONFIG_MODULE_REL_CRCS
          ./scripts/config --file ../out/.config --disable CONFIG_KSU
          ./scripts/config --file ../out/.config --set-val CONFIG_FRAME_WARN 0
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto-g26b07e8cb7f6"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO

          # ---- Resto de drivers MMI que el árbol pide ----
          ./scripts/config --file ../out/.config --enable CONFIG_SCHED_WALT
          ./scripts/config --file ../out/.config --enable CONFIG_SCHED_CASS
          ./scripts/config --file ../out/.config --enable CONFIG_TASKS_TRACE_RCU
          ./scripts/config --file ../out/.config --enable CONFIG_TASKS_RCU
          ./scripts/config --file ../out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file ../out/.config --enable CONFIG_QCOM_SCM

          yes "1" | make ARCH=arm64 O=../out olddefconfig || true

      - name: Verify .config (WiFi debe estar vivo)
        run: |
          cd kernel
          echo "=== WiFi / antena (DEBE estar activo) ==="
          grep -E "CONFIG_(MT7601U|WLAN_VENDOR_MEDIATEK|MAC80211|MAC80211_RC_MINSTREL|CFG80211)" ../out/.config || echo "!!! FALTA WIFI !!!"
          echo ""
          echo "=== Stack MMI (informativo) ==="
          grep -E "CONFIG_(SND_SOC_FS1815|CAMERA_CCI_INTF|INPUT_GOODIX_FOD_MMI|DRM_PANEL_NOTIFIER|TOUCHSCREEN_CHIPONE)" ../out/.config || echo "(algunos no presentes, no bloquean)"
          echo ""
          echo "=== Verify OK ==="
          exit 0

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            Image modules

      - name: Collect .ko files
        run: |
          mkdir -p ko_output
          find out -name "mt7601u.ko" -exec cp {} ko_output/ \;
          find out -name "mac80211.ko" -exec cp {} ko_output/ \; || true
          find out -name "cfg80211.ko" -exec cp {} ko_output/ \; || true
          ls -lh ko_output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            out/arch/arm64/boot/Image
            ko_output/*.ko
