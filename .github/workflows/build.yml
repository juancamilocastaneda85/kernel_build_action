name: Build MT7601U AP Driver
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-23.2
          path: kernel

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget xz-utils

      - name: Download clang
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Patch source
        run: |
          cd kernel
          sed -i 's/wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION);/wiphy->interface_modes = BIT(NL80211_IFTYPE_STATION) | BIT(NL80211_IFTYPE_AP);/' drivers/net/wireless/mediatek/mt7601u/init.c
          printf '/* PATCH: trace.h vacio */\n#ifndef __MT7601U_TRACE_H\n#define __MT7601U_TRACE_H\n#endif\n' > drivers/net/wireless/mediatek/mt7601u/trace.h
          echo '/* PATCH: trace.c vacio */' > drivers/net/wireless/mediatek/mt7601u/trace.c
          sed -i 's/^mt7601u-y.*debugfs\.o.*$/# PATCH: debugfs.o excluded/' drivers/net/wireless/mediatek/mt7601u/Makefile
          printf '/* PATCH: MT_PHY_TYPE_* */\n#ifndef MT_PHY_TYPE_CCK\n#define MT_PHY_TYPE_CCK 0\n#endif\n#ifndef MT_PHY_TYPE_OFDM\n#define MT_PHY_TYPE_OFDM 1\n#endif\n#ifndef MT_PHY_TYPE_HT\n#define MT_PHY_TYPE_HT 2\n#endif\n#ifndef MT_PHY_TYPE_HT_GF\n#define MT_PHY_TYPE_HT_GF 3\n#endif\n' > /tmp/phy_types.h
          cat /tmp/phy_types.h drivers/net/wireless/mediatek/mt7601u/init.c > /tmp/init_new.c
          mv /tmp/init_new.c drivers/net/wireless/mediatek/mt7601u/init.c

      - name: Neutralize trace macros
        run: |
          cd kernel
          for f in usb.c init.c main.c mcu.c dma.c core.c eeprom.c phy.c mac.c tx.c util.c debugfs.c; do
            FILE=drivers/net/wireless/mediatek/mt7601u/$f
            if [ -f "$FILE" ]; then
              printf '%s\n' \
                '/* PATCH-TRACE */' \
                '#define trace_mt_mcu_msg_send(...) do {} while (0)' \
                '#define trace_mt_submit_urb_sync(...) do {} while (0)' \
                '#define trace_mt_submit_urb(...) do {} while (0)' \
                '#define trace_mt_vend_req(...) do {} while (0)' \
                '#define trace_reg_read(...) do {} while (0)' \
                '#define trace_reg_write(...) do {} while (0)' \
                '#define trace_mt_rx(...) do {} while (0)' \
                '#define trace_mt_tx(...) do {} while (0)' \
                '#define trace_mt_tx_status_cleaned(...) do {} while (0)' \
                '#define trace_mt_rx_dma_aggr(...) do {} while (0)' \
                '#define trace_mt_tx_dma_done(...) do {} while (0)' \
                '#define trace_mt_bbp_read(...) do {} while (0)' \
                '#define trace_mt_bbp_write(...) do {} while (0)' \
                '#define trace_mt_freq_cal_adjust(...) do {} while (0)' \
                '#define trace_mt_freq_cal_offset(...) do {} while (0)' \
                '#define trace_mt_read_temp(...) do {} while (0)' \
                '#define trace_mt_rf_read(...) do {} while (0)' \
                '#define trace_mt_rf_write(...) do {} while (0)' \
                '#define trace_mt_temp_mode(...) do {} while (0)' \
                '#define trace_mt_set_key(...) do {} while (0)' \
                '#define trace_mt_set_shared_key(...) do {} while (0)' \
                > /tmp/patch_header.txt
              cat /tmp/patch_header.txt "$FILE" > /tmp/new_file.c
              mv /tmp/new_file.c "$FILE"
            fi
          done

      - name: Config
        run: |
          cd kernel
          mkdir -p ../out
          make ARCH=arm64 O=../out vendor/holi-qgki_defconfig
          cat arch/arm64/configs/vendor/holi_GKI.config >> ../out/.config
          cat arch/arm64/configs/vendor/holi_consolidate.config >> ../out/.config
          cat arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config >> ../out/.config
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto-gc8bc4b74db62"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO
          ./scripts/config --file ../out/.config --enable CONFIG_MODVERSIONS
          ./scripts/config --file ../out/.config --enable CONFIG_MODULE_FORCE_LOAD
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --enable CONFIG_CFG80211
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211_RC_MINSTREL
          ./scripts/config --file ../out/.config --enable CONFIG_MAC80211_RC_MINSTREL_HT
          yes "" | make ARCH=arm64 O=../out olddefconfig

      - name: Build module
        run: |
          cd kernel
          make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            modules_prepare
          KBUILD_MODPOST_WARN=1 make ARCH=arm64 O=../out -j4 \
            CC=../clang/bin/clang \
            LD=../clang/bin/ld.lld \
            AR=../clang/bin/llvm-ar \
            NM=../clang/bin/llvm-nm \
            OBJCOPY=../clang/bin/llvm-objcopy \
            OBJDUMP=../clang/bin/llvm-objdump \
            STRIP=../clang/bin/llvm-strip \
            M=drivers/net/wireless/mediatek/mt7601u \
            modules

      - name: Verify module
        run: |
          cd kernel
          ls -lh ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
          modinfo ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko | grep vermagic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-ap-module
          path: out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
