name: Build Kernel with MT7601U (LineageOS 23.2 fogos)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-23.2
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev bc python3 wget curl xz-utils

      - name: Download clang
        run: |
          mkdir -p clang
          curl -sL https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-20.0.tar.gz | tar -xzf - -C clang --strip-components=1

      - name: Patch mt7601u trace.h
        run: |
          cd kernel
          sed -i 's|#define TRACE_INCLUDE_PATH .*|#define TRACE_INCLUDE_PATH ../../drivers/net/wireless/mediatek/mt7601u|' \
            drivers/net/wireless/mediatek/mt7601u/trace.h
          grep -n "TRACE_INCLUDE_PATH" drivers/net/wireless/mediatek/mt7601u/trace.h

      - name: Configure kernel
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1 LLVM_IAS=1
          make O=../out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 vendor/holi-qgki_defconfig
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO
          make O=../out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig < /dev/null
          ./scripts/config --file ../out/.config --module CONFIG_MT7601U
          ./scripts/config --file ../out/.config --set-str CONFIG_LOCALVERSION "-moto"
          ./scripts/config --file ../out/.config --disable CONFIG_LOCALVERSION_AUTO
          grep -E "CONFIG_MT7601U=|CONFIG_WLAN_VENDOR_MEDIATEK=|CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=|CONFIG_MODVERSIONS=" ../out/.config

      - name: Build kernel and modules
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          make O=../out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j4 KCFLAGS="-Wno-error -D__ANDROID_COMMON_KERNEL__" Image modules < /dev/null

      - name: Rebuild mt7601u.ko with correct CRCs
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          rm -f ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
          make O=../out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            M=drivers/net/wireless/mediatek/mt7601u \
            modules < /dev/null
          ls -la ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko

      - name: Verify vermagic
        run: |
          echo "=== Kernel vermagic ==="
          strings ../out/vmlinux | grep -m1 "5.4.302" || true
          echo ""
          echo "=== Module vermagic ==="
          ../out/scripts/mod/modpost --version 2>/dev/null || true
          modinfo ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko 2>/dev/null | grep vermagic || \
            strings ../out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko | grep -m1 "vermagic=" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-fogos-lineage
          path: |
            out/arch/arm64/boot/Image
            out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko
            out/Module.symvers
          if-no-files-found: warn
