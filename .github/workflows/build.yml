name: Build Kernel with MT7601U

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # <-- Añade esta línea

      - name: Build Kernel
        uses: ./
        with:
          kernel-url: https://github.com/SushiKernel/android_kernel_motorola_fogos_nah
          kernel-branch: seventeen
          config: vendor/fogos_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          aosp-clang-version: r416183b
          nethunter: true
          disable-lto: true
          ksu: false
          ksu-lkm: true
